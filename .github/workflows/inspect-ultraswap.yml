name: Inspect Ultra Swap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ultraswap.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ultra.swap ABI
        run: |
          docker pull quay.io/ultra.io/3rdparty-devtools:latest >/dev/null
          docker run --rm --entrypoint /bin/bash             quay.io/ultra.io/3rdparty-devtools:latest             -lc 'cleos -u https://ultra-testnet.eosphere.io get abi ultra.swap'
