name: Inspect Ultra Swap Symbols

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ultraswap-symbols.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read ultra.swap symbols and balances
        run: |
          docker pull quay.io/ultra.io/3rdparty-devtools:latest >/dev/null
          docker run --rm --entrypoint /bin/bash quay.io/ultra.io/3rdparty-devtools:latest -lc '
            echo "=== ultra.swap symbols ==="
            cleos -u https://ultra-testnet.eosphere.io get table ultra.swap ultra.swap symbols --limit 100 || true
            echo "=== ultra.swap USDT balance ==="
            cleos -u https://ultra-testnet.eosphere.io get currency balance eosio.token ultra.swap USDT || true
            echo "=== LP USDT balance ==="
            cleos -u https://ultra-testnet.eosphere.io get currency balance eosio.token 1aa2aa3aa4ws USDT || true
          '
