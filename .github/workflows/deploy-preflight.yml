name: Ultra Deployment Preflight

on:
  push:
    branches: [main]
    paths:
      - "scripts/deploy-testnet.sh"
      - ".github/workflows/deploy-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Ultra Testnet account and RAM
        run: |
          curl --fail-with-body -sS -X POST \
            https://ultra-testnet.eosphere.io/v1/chain/get_account \
            -H 'Content-Type: application/json' \
            -d '{"account_name":"1aa2aa3aa4wr"}' > /tmp/limeb-account.json

          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/limeb-account.json"))
          account = data.get("account_name")
          balance = data.get("core_liquid_balance")
          ram = int(data.get("ram_quota", 0))
          last_code_update = data.get("last_code_update")

          print(f"Account: {account}")
          print(f"Balance: {balance}")
          print(f"RAM quota: {ram} bytes")
          print(f"Last code update: {last_code_update}")

          if account != "1aa2aa3aa4wr":
              raise SystemExit("Unexpected Ultra account response")
          if ram <= 0:
              raise SystemExit(
                  "Lime B account has 0 RAM. Buy Ultra Testnet RAM before contract deployment."
              )
          PY

      - name: Verify contract source
        run: |
          test -s contracts/limeb/limeb.cpp
          grep -q 'CONTRACT limeb' contracts/limeb/limeb.cpp

      - name: Pull Ultra developer tools
        run: docker pull quay.io/ultra.io/3rdparty-devtools:latest

      - name: Compile deployable WASM and ABI
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$PWD:/opt/ultra_workdir/LimeHouse" \
            quay.io/ultra.io/3rdparty-devtools:latest \
            -lc 'cd /opt/ultra_workdir/LimeHouse/contracts/limeb && cdt-cpp -o limeb.wasm limeb.cpp'
          test -s contracts/limeb/limeb.wasm
          test -s contracts/limeb/limeb.abi

      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: limeb-testnet-deploy-bundle
          path: |
            contracts/limeb/limeb.wasm
            contracts/limeb/limeb.abi
            scripts/deploy-testnet.sh
